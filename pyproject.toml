[project]
name = "axm-forge-workspace"
version = "0.0.0"
requires-python = ">=3.12"
description = "AXM Forge workspace — axm-ast, axm-audit, axm-init, and axm-git under one roof"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "Gabriel Jarry", email = "gabriel@axm-protocols.io" }]
keywords = ["axm", "ast", "audit", "scaffolding", "git", "quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://forge.axm-protocols.io"
Repository = "https://github.com/axm-protocols/axm-forge"
Documentation = "https://forge.axm-protocols.io"

[dependency-groups]
dev = [
    "prek>=0.4.9",
    "ruff==0.16.1",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "mypy>=2.2.0",
    "pip-audit>=2.10.1",
    "pytest-xdist>=3.8.0",
]
docs = [
    "mkdocs-material>=9.7.6",
    "mkdocs-monorepo-plugin>=1.1",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
]

[tool.uv]
constraint-dependencies = [
    "requests>=2.33.0",
    "pygments>=2.20.0",
]

[tool.uv.workspace]
members = ["packages/*"]

# Pin torch to the CPU wheel on Linux (CI). The default PyPI Linux wheel is the
# CUDA build: its init imports cuda.bindings, which calls find_library("dl") ->
# subprocess.Popen(['/sbin/ldconfig', '-p']). On a GPU-less runner that fork is
# pointless, and when an echo test mocks subprocess to assert the in-process
# embedding guarantee, it interrupts torch mid-init -> "partially initialised
# module 'torch' has no attribute 'types'" (circular import) + SIGSEGV. The CPU
# wheel drops cuda.bindings entirely. macOS keeps its native wheel (CPU/MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
axm = { workspace = true }
axm-anvil = { workspace = true }
axm-ast = { workspace = true }
axm-audit = { workspace = true }
axm-edit = { workspace = true }
axm-init = { workspace = true }
axm-git = { workspace = true }
axm-ingot = { workspace = true }
axm-echo = { workspace = true }
axm-mcp = { workspace = true }
axm-smelt = { workspace = true }
axm-config = { workspace = true }
axm-vault = { workspace = true }
axm-doctor = { workspace = true }

[tool.pytest.ini_options]
# Replicated from the per-package configs: a ROOT run is driven by this file.
pythonpath = [
    "packages/axm-audit/tests_axm_audit",
]

import_mode = "importlib"
testpaths = [
    "packages/axm/tests_axm",
    "packages/axm-anvil/tests_axm_anvil",
    "packages/axm-ast/tests_axm_ast",
    "packages/axm-audit/tests_axm_audit",
    "packages/axm-config/tests_axm_config",
    "packages/axm-doctor/tests_axm_doctor",
    "packages/axm-echo/tests_axm_echo",
    "packages/axm-edit/tests_axm_edit",
    "packages/axm-git/tests_axm_git",
    "packages/axm-ingot/tests_axm_ingot",
    "packages/axm-init/tests_axm_init",
    "packages/axm-mcp/tests_axm_mcp",
    "packages/axm-smelt/tests_axm_smelt",
    "packages/axm-vault/tests_axm_vault",
    # Workspace-level tests (pre-commit config, uv.lock, workspace render):
    # they belong to no package, so they need their own entry or they never run.
    "tests",
]

[tool.ruff.lint.per-file-ignores]
"**/tests_*/**" = ["PLR2004"]
