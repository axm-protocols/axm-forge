name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect workspace packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
      all: ${{ steps.matrix.outputs.all }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/workspace-matrix
        id: matrix

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-groups
      # Ruff stays global: fast (<10s) and enforces format consistency
      # across the whole repo regardless of which package changed.
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Workspace matrix regression tests
        run: uv run pytest tests/e2e/test_workspace_ci.py --no-cov
      - name: MyPy (affected workspace members)
        env:
          MEMBERS: ${{ needs.changes.outputs.packages }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          for member in json.loads(os.environ["MEMBERS"]):
              subprocess.run(
                  ["uv", "run", "--package", member["name"],
                   "--directory", member["path"], "mypy",
                   "--config-file", "pyproject.toml", "src", *member["tests"]],
                  check=True,
              )
          PY

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-groups
      - run: uv run pip-audit
        continue-on-error: true  # warn-only until all transitive CVEs have upstream fixes

  test:
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    name: Test ${{ matrix.package.name }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-packages --all-groups
      - name: Configure git identity (required by axm-init scaffold tests)
        run: |
          git config --global user.email "ci@axm.local"
          git config --global user.name "axm CI"
      - name: Test package
        env:
          PACKAGE: ${{ matrix.package.name }}
          PACKAGE_DIR: ${{ matrix.package.path }}
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --package "$PACKAGE" --directory "$PACKAGE_DIR" pytest --cov
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ${{ matrix.package.path }}/coverage.xml
          flags: ${{ matrix.package.name }}
          fail_ci_if_error: false
