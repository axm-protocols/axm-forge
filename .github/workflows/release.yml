name: Release

on:
  push:
    # Same single rule as publish.yml: the long tag convention makes the
    # prefix the package directory, so no list to keep in sync.
    tags:
      - "*/v*"

jobs:
  release:
    name: Generate Changelog & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect package from tag
        id: detect
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREFIX="${TAG%%/*}"
          DIR="packages/$PREFIX"
          # This job checks out the repository before detecting, so the
          # package directory is readable here.
          if [ ! -f "$DIR/pyproject.toml" ]; then
            echo "::error::No package for tag prefix '$PREFIX' (expected $DIR/pyproject.toml)"
            exit 1
          fi
          echo "package=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "package-dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "tag-prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: ${{ steps.detect.outputs.package-dir }}/pyproject.toml
          args: >-
            --latest
            --strip header
            --tag-pattern '${{ steps.detect.outputs.tag-prefix }}/v*'
            --include-path '${{ steps.detect.outputs.package-dir }}/**'
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          token: ${{ secrets.GITHUB_TOKEN }}
