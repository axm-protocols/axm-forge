name: Publish to PyPI

on:
  push:
    # One rule for every package: the long tag convention makes the prefix
    # the package directory (axm-git/v0.6.0 -> packages/axm-git), so a new
    # package needs no CI change — only a tag.
    tags:
      - "*/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run, nothing is published)"
        required: true

jobs:
  detect-package:
    name: Detect Package
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.detect.outputs.package }}
      package-dir: ${{ steps.detect.outputs.package-dir }}
      publishable: ${{ steps.detect.outputs.publishable }}
    steps:
      - id: detect
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ -z "$TAG" ] && TAG="${{ inputs.tag }}"
          PKG="${TAG%%/*}"
          DIR="packages/$PKG"
          if [ ! -f "$DIR/pyproject.toml" ]; then
            echo "::error::No package for tag prefix '$PKG' (expected $DIR/pyproject.toml)"
            exit 1
          fi
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "package-dir=$DIR" >> "$GITHUB_OUTPUT"
          # A package declares its own destination. PyPI refuses the
          # "Private ::" classifier prefix on upload, so this is a double
          # safety net rather than the only one.
          if grep -q "Private :: Do Not Upload" "$DIR/pyproject.toml"; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG is declared private — build only, no upload"
          else
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Tests (${{ needs.detect-package.outputs.package }})
    needs: detect-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: Configure git identity (required by axm-init scaffold tests)
        run: |
          git config --global user.email "ci@axm.local"
          git config --global user.name "axm CI"
      - run: uv run --package ${{ needs.detect-package.outputs.package }} --directory ${{ needs.detect-package.outputs.package-dir }} pytest --no-cov

  publish:
    name: Build and Publish (${{ needs.detect-package.outputs.package }})
    runs-on: ubuntu-latest
    needs: [detect-package, test]
    # Two gates, both must open: the package must not declare itself private,
    # and the run must come from a real tag push. A workflow_dispatch builds
    # the artefact and stops there — the only way to rehearse this workflow
    # without an irreversible upload.
    if: >-
      needs.detect-package.outputs.publishable == 'true'
      && github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.detect-package.outputs.package }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv build --package ${{ needs.detect-package.outputs.package }}
      - uses: pypa/gh-action-pypi-publish@release/v1
