version: 2
updates:
  # ── Workspace root: the single shared uv.lock ──────────────────────────────
  # uv ecosystem (Dependabot GA 2025-03) re-resolves the one workspace lockfile
  # (members share it) and the root pyproject. One consolidated weekly PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # Un `ignore` est scopé à SON bloc directory : celui posé plus bas sur
      # /packages/axm-ast ne protège que les PRs du groupe axm-ast. Le scan de
      # la racine re-résout le uv.lock agrégé, y voit tree-sitter remonter via
      # packages/axm-ast, et repropose la 0.26.0 dans le groupe
      # all-dependencies — c'est ainsi qu'est née la PR #136 (38 crashs de
      # workers xdist sur axm-ast, axm-audit et axm), 41 minutes APRÈS que la
      # règle axm-ast eut été mergée. Tout garde-fou de version doit donc
      # exister aux deux niveaux, sinon la protection par package est
      # contournée par le groupe racine.
      #
      # Motif détaillé du blocage (use-after-free amont, py-tree-sitter#472) :
      # voir le bloc /packages/axm-ast plus bas, source de vérité. Même portée
      # volontairement étroite : la 0.26.0 SEULE, pour qu'une 0.26.1 porteuse
      # du fix soit reproposée d'elle-même.
      - dependency-name: tree-sitter
        versions: ["0.26.0"]

  # ── Per published package: the pyproject CONSTRAINTS (the PyPI contract) ────
  # Each package is published independently to PyPI and is importable by third
  # parties (`uv add axm-audit`, Python API), so its own declared constraints
  # are a public contract worth keeping current — distinct from the shared lock
  # above. One grouped weekly PR per package.
  - package-ecosystem: uv
    directory: /packages/axm
    schedule:
      interval: weekly
    groups:
      axm:
        patterns:
          - "*"
    # ruff/mypy/pytest/prek sont fixes UNE fois par `[tool.uv]
    # .constraint-dependencies` a la racine ; les membres n'en portent qu'un
    # plancher. Un bump de plancher au-dessus de la contrainte rend le
    # workspace insoluble (vu sur axm-knowledge#37, axm-cortex#42).
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-anvil
    schedule:
      interval: weekly
    groups:
      axm-anvil:
        patterns:
          - "*"
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-ast
    schedule:
      interval: weekly
    groups:
      axm-ast:
        patterns:
          - "*"
    ignore:
      # tree-sitter 0.26.0 introduit un use-after-free : les getters Point.row /
      # Point.column renvoient une référence EMPRUNTÉE (refonte de Point en
      # sous-classe de tuple), l'int est libéré trop tôt et corrompt
      # l'allocateur — SIGSEGV/SIGBUS dès qu'on lit un Point sur un fichier de
      # plus de ~256 lignes (au-delà des ints immortels). Reproduit ici :
      # 0.25.2 → EXIT=0 sur 360 000 lectures, 0.26.0 → EXIT=139 après 1 200.
      # axm-ast est en plein dans le chemin du bug (23 lectures de
      # start_point.row/end_point.row, 104 fichiers de plus de 256 lignes).
      # Amont : tree-sitter/py-tree-sitter#472, corrigé le 2026-07-08 (PR #466)
      # mais JAMAIS PUBLIÉ — 0.26.0 (2026-06-30) reste la dernière release PyPI.
      #
      # On ignore la 0.26.0 SEULE, pas la série 0.26.x : à la publication d'une
      # 0.26.1 (qui portera le fix), Dependabot reproposera le bump de lui-même
      # et le cap `<0.26` de packages/axm-ast/pyproject.toml pourra sauter.
      # L'API et l'ABI des grammaires (LANGUAGE_VERSION 15, min 13) sont déjà
      # compatibles : seul ce use-after-free bloque.
      - dependency-name: tree-sitter
        versions: ["0.26.0"]
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-audit
    schedule:
      interval: weekly
    groups:
      axm-audit:
        patterns:
          - "*"
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-edit
    schedule:
      interval: weekly
    groups:
      axm-edit:
        patterns:
          - "*"
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-git
    schedule:
      interval: weekly
    groups:
      axm-git:
        patterns:
          - "*"
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-init
    schedule:
      interval: weekly
    groups:
      axm-init:
        patterns:
          - "*"
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-mcp
    schedule:
      interval: weekly
    groups:
      axm-mcp:
        patterns:
          - "*"
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-smelt
    schedule:
      interval: weekly
    groups:
      axm-smelt:
        patterns:
          - "*"
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek

  - package-ecosystem: uv
    directory: /packages/axm-ingot
    schedule:
      interval: weekly
    groups:
      axm-ingot:
        patterns:
          - "*"
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-echo
    schedule:
      interval: weekly
    groups:
      axm-echo:
        patterns:
          - "*"
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-config
    schedule:
      interval: weekly
    groups:
      axm-config:
        patterns:
          - "*"
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-vault
    schedule:
      interval: weekly
    groups:
      axm-vault:
        patterns:
          - "*"
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: uv
    directory: /packages/axm-doctor
    schedule:
      interval: weekly
    groups:
      axm-doctor:
        patterns:
          - "*"

  # ── GitHub Actions used by the workspace workflows ─────────────────────────
    ignore:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pytest
      - dependency-name: prek
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # ── pre-commit hooks: the `rev:` of .pre-commit-config.yaml ────────────────
  # Écosystème `pre-commit` (Dependabot GA 2026-03-10) : il lit le fichier,
  # interroge le dépôt de chaque hook et propose le bump de `rev:`, changelog
  # inclus. Ces révisions n'étaient suivies par AUCUN des blocs ci-dessus —
  # ni `uv` (le hook télécharge son propre binaire, hors du lock), ni
  # `github-actions`. Elles dérivaient donc en silence.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    ignore:
      # ruff est déclaré à DEUX endroits qui doivent rester égaux : ce `rev:`
      # et `[tool.uv].constraint-dependencies`. Dependabot ne connaît que le
      # premier : sa PR formaterait en local avec une version pendant que la CI
      # vérifierait avec l'autre, et `ruff format --check` étant bloquant, la
      # divergence se paierait au push suivant.
      #
      # Même portée étroite que l'`ignore` tree-sitter plus haut : on exclut ce
      # seul hook, pas l'écosystème. Les deux autres (pre-commit-hooks,
      # conventional-pre-commit) n'ont pas ce couplage et restent suivis.
      # Le bump de ruff se fait donc à la main, les deux sites ensemble.
      # L'ecosysteme pre-commit nomme le hook par son URL complete : la forme
      # courte `astral-sh/ruff-pre-commit` ne correspondait a rien.
      - dependency-name: https://github.com/astral-sh/ruff-pre-commit
