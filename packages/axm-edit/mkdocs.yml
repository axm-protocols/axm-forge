site_name: edit
site_description: Validated batch file editing, checkpoints and filesystem tools
site_url: https://forge.axm-protocols.io/edit/
repo_url: https://github.com/axm-protocols/axm-forge
repo_name: axm-protocols/axm-forge
edit_uri: edit/main/packages/axm-edit/docs/
copyright: Copyright &copy; 2026 axm-protocols

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Tutorials:
    - Edit and undo a project: tutorials/getting-started.md
  - How-to guides:
    - Choose a workflow: howto/index.md
    - MCP and CLI: howto/mcp.md
    - Guarded rewrite: howto/rewrite.md
    - Rollback: howto/rollback.md
  - Reference:
    - CLI and tool registry: reference/cli.md
    - Batch operations: reference/batch.md
    - Filesystem tools: reference/filesystem.md
    - Python API: reference/api/index.md
  - Explanation:
    - Architecture and guarantees: explanation/architecture.md

exclude_docs: |
  gen_ref_pages.py

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
