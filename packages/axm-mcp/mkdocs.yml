site_name: axm-mcp
site_description: AXM MCP Server — discovery shell with a compact facade over the axm-protocols tool ecosystem
site_url: https://forge.axm-protocols.io/axm-mcp/
repo_url: https://github.com/axm-protocols/axm-forge
repo_name: axm-protocols/axm-forge
copyright: Copyright &copy; 2026 axm-protocols
docs_dir: docs

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Overview: index.md
  - Tutorials:
    - Getting Started: tutorials/getting-started.md
    - Quick Start: tutorials/quickstart.md
  - How-To Guides:
    - howto/index.md
    - Add a Tool: howto/add-tool.md
    - Migrate to HTTP Transport: howto/migration-http.md
    - Verify Setup: howto/verify.md
  - Reference:
    - CLI: reference/cli.md
    - Configuration: reference/configuration.md
    - Facade and Results: reference/facade.md
    - Built-in Tools: reference/builtins.md
    - Shared Contracts: reference/shared-contracts.md
    - Python API: reference/api/index.md
  - Explanation:
    - Architecture: explanation/architecture.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
