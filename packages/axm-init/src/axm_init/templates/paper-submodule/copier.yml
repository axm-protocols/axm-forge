# Copier configuration for the AXM paper submodule scaffold.
#
# Two legitimate flavours:
#   - autonomous paper  (has_package = true)  -> ships its own src/ package
#   - satellite paper   (has_package = false) -> companion of an existing lib

_min_copier_version: "9.0.0"
_templates_suffix: .jinja
_exclude:
  # Copier replaces (does not extend) its default exclude list, so the
  # stock patterns must be re-declared or the template's own build cruft
  # (``.mypy_cache``, ``__pycache__``, …) gets copied into every scaffold.
  - "copier.yml"
  - "licences"
  - "__pycache__"
  - "*.py[co]"
  - ".mypy_cache"
  - ".ruff_cache"
  - ".pytest_cache"
  - ".DS_Store"

# =============================================================================
# Questions — ordered by decision priority
# =============================================================================

paper_name:
  type: str
  help: "Paper slug (lowercase, hyphens allowed, e.g., attention-study)"
  validator: "{% if not paper_name | regex_search('^[a-z][a-z0-9-]*$') %}Invalid paper name - use lowercase letters, numbers, and hyphens{% endif %}"

title:
  type: str
  help: "Human-readable paper title"
  default: "Untitled paper"

author:
  type: str
  help: "Author name"
  default: "Unknown author"

gap_statement:
  type: str
  help: "Gap in the literature this paper closes (one sentence)"
  default: "TODO: state the gap in the literature this paper closes."

has_package:
  type: bool
  help: "Autonomous paper shipping its own Python package? (no = satellite)"
  default: true

package_name:
  type: str
  help: "Python module name of the embedded package"
  default: "{{ paper_name | replace('-', '_') }}"
  when: "{{ has_package }}"
