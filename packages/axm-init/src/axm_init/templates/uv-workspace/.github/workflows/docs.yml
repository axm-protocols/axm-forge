name: Docs

on:
  push:
    branches: [main]

# Declaring any permission resets every other scope to `none`, so `contents`
# has to be spelled out: without it the job cannot even check out its own
# repository when that repository is private ("Repository not found" from
# actions/checkout). python-project's docs.yml already gets this right.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v5
