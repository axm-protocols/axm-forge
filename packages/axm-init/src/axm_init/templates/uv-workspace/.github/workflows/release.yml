name: Release

on:
  push:
    # Same single rule as publish.yml: the long tag convention makes the
    # prefix the package directory, so no list to keep in sync.
    tags:
      - "*/v*"

permissions:
  contents: write

jobs:
  release:
    name: Generate Changelog & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same detection as publish.yml, from the same composite action. Only the
      # package directory is used here: unlike PyPI, a GitHub Release is not a
      # publication to the world. It inherits the repository's visibility, so on
      # a private repo it is readable only by people who already have the code.
      # `Private :: Do Not Upload` says where a package may be UPLOADED; it says
      # nothing about writing down what changed between two tags.
      - name: Detect package from tag
        id: detect
        uses: ./.github/actions/detect-package

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: ${{ steps.detect.outputs.package-dir }}/pyproject.toml
          args: >-
            --latest
            --strip header
            --tag-pattern '${{ steps.detect.outputs.package }}/v*'
            --include-path '${{ steps.detect.outputs.package-dir }}/**'
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          token: ${{ secrets.GITHUB_TOKEN }}
