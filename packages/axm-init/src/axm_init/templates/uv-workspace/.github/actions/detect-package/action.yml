name: Detect package
description: Resolve the package a release tag designates and whether it may be published.
inputs:
  tag:
    description: Tag to resolve; defaults to the pushed ref.
    required: false
    default: ""
outputs:
  package:
    description: Package name, taken from the tag prefix
    value: ${{ steps.detect.outputs.package }}
  package-dir:
    description: Package directory under packages/
    value: ${{ steps.detect.outputs.package-dir }}
  publishable:
    description: Whether the package allows external publication
    value: ${{ steps.detect.outputs.publishable }}
runs:
  using: composite
  steps:
    # The caller must have checked out the repository: detection reads the
    # package directory and its classifiers from the working tree.
    - id: detect
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        [ -z "$TAG" ] && TAG="$INPUT_TAG"
        PKG="${TAG%%/*}"
        DIR="packages/$PKG"
        if [ ! -f "$DIR/pyproject.toml" ]; then
          echo "::error::No package for tag prefix '$PKG' (expected $DIR/pyproject.toml)"
          exit 1
        fi
        echo "package=$PKG" >> "$GITHUB_OUTPUT"
        echo "package-dir=$DIR" >> "$GITHUB_OUTPUT"
        # A package declares its own destination. PyPI refuses the
        # "Private ::" classifier prefix on upload, so this is a double
        # safety net rather than the only one. Every consumer of this action
        # reads the same answer — the classifier is stated once, here.
        if grep -q "Private :: Do Not Upload" "$DIR/pyproject.toml"; then
          echo "publishable=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$PKG is declared private — no external publication"
        else
          echo "publishable=true" >> "$GITHUB_OUTPUT"
        fi
