# Copier configuration for UV workspace scaffold
# Usage: axm-init scaffold --workspace --name my-workspace --org myorg

_min_copier_version: "9.0.0"
_templates_suffix: .jinja
_exclude:
  - "licences"
  - "copier.yml"
  # wrangler.toml configures the Cloudflare worker that serves the docs; it is
  # meaningless when the site is published to GitHub Pages.
  - "{% if docs_hosting != 'cloudflare' %}wrangler.toml{% endif %}"

# =============================================================================
# Questions
# =============================================================================

workspace_name:
  type: str
  help: "Workspace name (lowercase, hyphens allowed)"
  validator: "{% if not workspace_name | regex_search('^[a-z][a-z0-9-]*$') %}Invalid name - use lowercase letters, numbers, and hyphens{% endif %}"

description:
  type: str
  help: "One-line description"
  default: "A modern Python workspace"

license:
  type: str
  help: "License type"
  choices:
    - MIT
    - Apache-2.0
    - EUPL-1.2
  default: Apache-2.0

license_holder:
  type: str
  help: "Person or organization that holds the license"

org:
  type: str
  help: "GitHub organization or username"

author_name:
  type: str
  help: "Author name"

author_email:
  type: str
  help: "Author email"

python_min_version:
  type: str
  help: "Minimum Python version"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
  default: "3.12"

# GitHub Pages is the default because it is self-sufficient: the generated
# workflow needs no secret and publishes on the first push. Cloudflare is the
# convention across the existing AXM workspaces, but it requires
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets plus a
# DNS record — choosing it here generates wrangler.toml and the deploy step,
# and the job fails until those secrets exist.
docs_hosting:
  type: str
  help: "Where the documentation site is published"
  choices:
    GitHub Pages (no secrets needed): github-pages
    Cloudflare Workers (needs CLOUDFLARE_* secrets): cloudflare
  default: github-pages

docs_domain:
  type: str
  help: "Public docs domain (Cloudflare only), e.g. learning.axm-protocols.io"
  default: "{{ workspace_name }}.example.com"
  when: "{{ docs_hosting == 'cloudflare' }}"

# =============================================================================
# Computed values
# =============================================================================

year:
  type: str
  default: "2026"
  when: false

license_folder:
  type: str
  default: "{% if license == 'MIT' %}mit{% elif license == 'Apache-2.0' %}apache-2.0{% else %}eupl{% endif %}"
  when: false

# Pins the Workers runtime semantics for the generated wrangler.toml. Supplied
# by InitScaffoldTool (Jinja has no date filter and copier exposes none), so a
# workspace is born on the runtime current at its creation rather than on a
# date frozen in this template. The fallback keeps a bare `copier copy` usable.
compatibility_date:
  type: str
  default: "2026-01-01"
  when: false

python_matrix:
  type: str
  default: "{% if python_min_version == '3.11' %}[\"3.11\", \"3.12\", \"3.13\"]{% elif python_min_version == '3.12' %}[\"3.12\", \"3.13\"]{% else %}[\"3.13\"]{% endif %}"
  when: false

# =============================================================================
# Post-generation tasks
# =============================================================================

_tasks:
  - command: "cp {{ _copier_conf.src_path }}/licences/{{ license_folder }}/* ./"
    when: "{{ true }}"
  - command: "git init && git branch -M main"
    when: "{{ true }}"
  - command: "uv python pin {{ python_min_version }}"
    when: "{{ true }}"
  # Sync only when the workspace already has members. A fresh, member-less
  # workspace has nothing to resolve, and `uv sync` would fail and roll back
  # the whole scaffold. The shell guard keeps this safe both now (skip) and
  # later (sync once the user adds packages/<member>).
  - command: "sh -c 'for p in packages/*/pyproject.toml; do [ -e \"$p\" ] && exec uv sync; done; echo \"No workspace members yet — skipping uv sync (run it after adding a member).\"'"
    when: "{{ true }}"
  - command: "git add . && git commit -m 'feat: initial workspace scaffold'"
    when: "{{ true }}"
  - command: "uv run prek install"
    when: "{{ true }}"
  - "echo '✅ Workspace scaffolded! Run: cd {{ workspace_name }} && make test-all'"
