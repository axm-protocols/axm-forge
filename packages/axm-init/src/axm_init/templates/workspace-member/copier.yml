# Copier configuration for workspace member sub-package scaffold
# Usage: axm-init scaffold --member my-package

_min_copier_version: "9.0.0"
_templates_suffix: .jinja
_exclude:
  - "copier.yml"

# =============================================================================
# Questions
# =============================================================================

member_name:
  type: str
  help: "Member package name (lowercase, hyphens allowed)"
  validator: "{% if not member_name | regex_search('^[a-z][a-z0-9-]*$') %}Invalid name - use lowercase letters, numbers, and hyphens{% endif %}"

description:
  type: str
  help: "One-line summary (PEP 621 description; PyPI caps it at 512 chars)"
  default: "A workspace member package"
  # PEP 621 `description` becomes the core-metadata Summary: one line, and
  # PyPI refuses more than 512 characters. The module docstring wraps it, so
  # its length is not bound by the code line length.
  validator: "{% if '\n' in description or '\r' in description %}Description must be a single line{% elif description | length > 512 %}Description too long ({{ description | length }} chars, max 512){% endif %}"

author_name:
  type: str
  help: "Author name"

author_email:
  type: str
  help: "Author email"

org:
  type: str
  help: "GitHub organization or username"

license:
  type: str
  help: "License type"
  choices:
    - MIT
    - Apache-2.0
    - EUPL-1.2
  default: Apache-2.0

workspace_name:
  type: str
  help: "Parent workspace name"

repository:
  type: str
  help: "GitHub repository of the workspace (owner/name), for URLs and badges"
  default: "{{ org }}/{{ workspace_name }}"

docs_url:
  type: str
  help: "URL of this member's documentation"
  default: "https://{{ org }}.github.io/{{ workspace_name }}/{{ member_name }}/"

private:
  type: bool
  help: "Prevent publication to PyPI"
  # Safe default: removing one classifier is reversible; an accidental PyPI upload is not.
  default: true

# =============================================================================
# Computed values
# =============================================================================

module_name:
  type: str
  default: "{{ member_name | replace('-', '_') }}"
  when: false

year:
  type: str
  default: "2026"
  when: false
