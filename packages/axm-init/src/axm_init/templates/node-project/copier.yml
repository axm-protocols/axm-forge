# Copier configuration for a Node/TypeScript project scaffold.
# Mirrors the python-project template's variables so InitScaffoldTool can feed
# both from the same data dict. POC: no network _tasks (npm install) so the
# scaffold is deterministic and offline-testable; a follow-up can add an
# `npm install` post-task gated behind a flag.

_min_copier_version: "9.0.0"
_templates_suffix: .jinja
_exclude:
  - "copier.yml"

package_name:
  type: str
  help: "Package name (lowercase, hyphens allowed, e.g., my-app)"
  validator: "{% if not package_name | regex_search('^[a-z][a-z0-9-]*$') %}Invalid package name - use lowercase letters, numbers, and hyphens{% endif %}"

description:
  type: str
  help: "One-line description"
  default: "A modern Node package"

license:
  type: str
  help: "License type"
  default: Apache-2.0

org:
  type: str
  help: "GitHub organization or username that owns the repository (required)"

author_name:
  type: str
  help: "Author name"

author_email:
  type: str
  help: "Author email"
