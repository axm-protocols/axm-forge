site_name: ast
site_description: Read-only source analysis for Python and optional TypeScript.
theme:
  name: material
  features: [content.code.copy, navigation.indexes]

validation:
  nav:
    not_found: warn
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
docs_dir: docs

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true

nav:
  - Overview: index.md
  - Tutorials:
    - Getting Started: tutorials/getting-started.md
    - Quick Start: tutorials/quickstart.md
  - How-To Guides:
    - index: howto/index.md
    - Describe a Package: howto/describe.md
    - Analyze Change Impact: howto/impact.md
    - Trace Execution Flows: howto/flows.md
    - Use via MCP: howto/mcp.md
    - Scope and Languages: howto/scope-and-languages.md
  - Reference:
    - CLI: reference/cli.md
    - Diff, Flows and Docs CLI: reference/cli-tracing.md
    - API Guide: reference/api.md
    - AXM Tools: reference/tools.md
    - Python API: reference/api/
    - Describe Text: reference/describe-text.md
    - Inspect Detail: reference/inspect-detail.md
    - Inspect Resolve: reference/inspect-resolve.md
    - Hooks: reference/hooks.md
  - Explanation:
    - Architecture: explanation/architecture.md
    - Output Formats: explanation/formats.md
    - Cross-Module Resolution: explanation/cross_module_resolution.md
    - doc_impact Limits: explanation/doc_impact_limits.md
