site_name: anvil
site_description: CST-based Python refactoring — move, rename and extract with reviewable plans
site_url: https://forge.axm-protocols.io/anvil/
repo_url: https://github.com/axm-protocols/axm-forge
repo_name: axm-protocols/axm-forge
copyright: Copyright &copy; 2026 Gabriel Jarry
docs_dir: docs

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Tutorials:
    - Getting Started: tutorials/getting-started.md
  - How-To Guides:
    - howto/index.md
    - Use via MCP: howto/mcp.md
    - Review a refactor: howto/review.md
  - Reference:
    - CLI: reference/cli.md
    - Operation contracts: reference/contracts.md
    - Python API: reference/api/index.md
  - Explanation:
    - Architecture: explanation/architecture.md
    - Guarantees and limits: explanation/limits.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
